# Test profile for data/ samples. It parses the first 14-digit timestamp
# in names such as video_0446_0_10_20260905165246_20260905165756.mp4.
model: yolo11n.pt
recursive: true
extensions: [".mp4"]
sample_interval_seconds: 30
max_samples_per_video: 30
person_confidence: 0.35
baby_max_bbox_area_ratio: 0.12
baby_min_detections: 2
filename_time:
  enabled: true
  regex: "(?P<date>\\d{8})(?P<time>\\d{6})"
  date_format: "%Y%m%d"
  time_format: "%H%M%S"
night:
  start: "22:00"
  end: "07:00"
  keep_videos_with_person: false
reports:
  csv_encoding: utf-8-sig
