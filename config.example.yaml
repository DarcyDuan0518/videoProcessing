# Copy this file to config.yaml and adjust it for the camera's files.

# YOLO downloads this weight file on first use if it is not already cached.
# yolo11n.pt is fast. Try yolo11s.pt if accuracy is insufficient and GPU time allows.
model: yolo11n.pt

# Search subdirectories for supported video files.
recursive: true
extensions: [".mp4", ".avi", ".mov", ".mkv"]

# Analyze one frame every N seconds, up to max_samples_per_video frames.
# A 15-minute video with a 15-second interval generates at most 60 samples.
sample_interval_seconds: 15
max_samples_per_video: 60

# Person confidence threshold (0.0 - 1.0).
person_confidence: 0.35

# This is a heuristic only, not a true infant classifier. A person is treated as
# "baby-like" when their bounding box covers at most this fraction of the frame.
# Set null to disable the heuristic and only report person presence.
baby_max_bbox_area_ratio: 0.12
baby_min_detections: 2

# Extract recording date and time from the filename, not the file creation time.
# The default matches examples such as Camera_20260907_221530.mp4.
# Set enabled to false when filenames do not contain reliable timestamps.
filename_time:
  enabled: true
  regex: "(?P<date>\\d{8})[_-]?(?P<time>\\d{6})"
  date_format: "%Y%m%d"
  time_format: "%H%M%S"

# An overnight range is supported: 22:00 through 07:00 next day.
night:
  start: "22:00"
  end: "07:00"
  # false: a video dated at night becomes a deletion candidate even if a person exists.
  # true: night videos with a person are retained; only no-person videos become candidates.
  keep_videos_with_person: false

# Reports only: the program never deletes or moves source files.
# Output uses CSV with UTF-8 BOM so it opens correctly in Excel on Windows.
reports:
  csv_encoding: utf-8-sig
